name: Build and test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore TraceDeckFE.sln

      - name: Build Debug
        run: dotnet build TraceDeckFE.sln -c Debug --no-restore

      - name: Test Debug
        run: dotnet test TraceDeckFE.sln -c Debug --no-build

      - name: Build Release
        run: dotnet build TraceDeckFE.sln -c Release --no-restore

      - name: Test Release
        run: dotnet test TraceDeckFE.sln -c Release --no-build

